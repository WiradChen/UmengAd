plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umeng.demo'

    compileSdk 34

    defaultConfig {
        applicationId "com.umeng.demo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 签名配置
    signingConfigs {
        debug {
            storeFile file('src/main/jks/weather.jks')
            storePassword '123456'
            keyAlias 'weather'
            keyPassword '123456'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

