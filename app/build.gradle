plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umeng.demo'

    compileSdk 34

    defaultConfig {
        applicationId "com.umeng.demo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // SDK 依赖的第三方广告源库（已复制到 app/libs/，demo 自包含）
    // 按需引入：demo 使用穿山甲 CSJ + 瑞狮 vlion
    // 注：AAR 内 compileOnly，需在应用侧提供对应平台 SDK
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])  // 直接依赖整个 libs 文件夹

    // 基础支持库
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.google.android.material:material:1.6.0'  // MS 美数 SDK 的布局用了 CardView，必须保留
    // 以下 Demo 未直接使用，注释掉以减小包体（如需再开）
    // implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // 依赖库
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'com.github.gzu-liyujiang:Android_CN_OAID:4.2.4'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-datasource:2.19.1'
    implementation 'com.google.protobuf:protobuf-javalite:4.34.1'
    implementation "com.google.guava:guava:31.0.1-android"
    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.6"
    implementation "com.android.support.constraint:constraint-layout:2.0.4"
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.0'

    // 瑞狮 SDK（AdCore compileOnly，自带华为 hwsdk）
    implementation('cn.vlion.inland:vlion-core-ec:7.00.81') {
        exclude group: 'cn.vlion.inland', module: 'vlion-j'
        exclude group: 'cn.vlion.inland', module: 'vlion-wm-sdk'
    }
}
